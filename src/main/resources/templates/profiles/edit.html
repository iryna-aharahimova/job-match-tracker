<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Job Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Job Search Aggregator</span>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <a th:href="@{/profiles}" class="btn btn-link ps-0 mb-2">&larr; Back to profiles</a>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Edit Job Profile</h1>

                    <form th:action="@{/profiles/{id}(id=${profileId})}"
                          th:object="${jobProfileRequest}"
                          method="post"
                          novalidate>

                        <div class="mb-3">
                            <label for="profileName" class="form-label">Profile name *</label>
                            <input type="text"
                                   id="profileName"
                                   th:field="*{profileName}"
                                   placeholder="e.g. Java Backend Developer"
                                   th:classappend="${#fields.hasErrors('profileName')} ? 'is-invalid' : ''"
                                   class="form-control"/>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('profileName')}"
                                 th:errors="*{profileName}">Profile name error</div>
                        </div>

                        <div class="mb-3">
                            <label for="skillsText" class="form-label">Skills</label>
                            <textarea id="skillsText"
                                      th:field="*{skillsText}"
                                      class="form-control"
                                      rows="2"
                                      placeholder="Java, Spring Boot, PostgreSQL"></textarea>
                            <div class="form-text">Comma-separated. New skills will be saved automatically.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Preferred grades *</label>
                            <div>
                                <div th:each="grade : ${grades}" class="form-check form-check-inline">
                                    <input type="checkbox"
                                           class="form-check-input"
                                           th:id="${'grade-' + grade}"
                                           th:field="*{preferredGrades}"
                                           th:value="${grade}"/>
                                    <label class="form-check-label"
                                           th:for="${'grade-' + grade}"
                                           th:text="${grade}">GRADE</label>
                                </div>
                            </div>
                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('preferredGrades')}"
                                 th:errors="*{preferredGrades}">Grades error</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Work mode *</label>
                            <div>
                                <div th:each="mode : ${workModes}" class="form-check form-check-inline">
                                    <input type="checkbox"
                                           class="form-check-input"
                                           th:id="${'mode-' + mode}"
                                           th:field="*{workModes}"
                                           th:value="${mode}"/>
                                    <label class="form-check-label"
                                           th:for="${'mode-' + mode}"
                                           th:text="${mode}">MODE</label>
                                </div>
                            </div>
                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('workModes')}"
                                 th:errors="*{workModes}">Work mode error</div>
                        </div>

                        <button type="submit" class="btn btn-primary">Save changes</button>
                        <a th:href="@{/profiles}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
