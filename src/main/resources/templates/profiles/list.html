<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Profiles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Job Search Aggregator</span>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">My Job Profiles</h1>
        <a th:href="@{/profiles/create}" class="btn btn-primary">+ New profile</a>
    </div>

    <div th:if="${profiles.isEmpty()}" class="alert alert-info">
        You don't have any profiles yet. Create your first one to start tracking opportunities.
    </div>

    <div class="row g-3">
        <div th:each="profile : ${profiles}" class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${profile.profileName}">Profile name</h5>

                    <div class="mb-2">
                        <span class="text-muted small">Skills</span><br/>
                        <span th:if="${profile.skills.isEmpty()}" class="text-muted">—</span>
                        <span th:each="skill : ${profile.skills}"
                              class="badge text-bg-secondary me-1"
                              th:text="${skill.skillName}">Skill</span>
                    </div>

                    <div class="mb-2">
                        <span class="text-muted small">Preferred grades</span><br/>
                        <span th:if="${profile.preferredGrades.isEmpty()}" class="text-muted">—</span>
                        <span th:each="grade : ${profile.preferredGrades}"
                              class="badge text-bg-info me-1"
                              th:text="${grade}">GRADE</span>
                    </div>

                    <div class="mb-3">
                        <span class="text-muted small">Work mode</span><br/>
                        <span th:if="${profile.workModes.isEmpty()}" class="text-muted">—</span>
                        <span th:each="mode : ${profile.workModes}"
                              class="badge text-bg-success me-1"
                              th:text="${mode}">MODE</span>
                    </div>

                    <div class="mt-auto d-flex gap-2">
                        <a th:href="@{/profiles/{id}/edit(id=${profile.id})}"
                           class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:action="@{/profiles/{id}/delete(id=${profile.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this profile?');"
                              class="m-0">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
